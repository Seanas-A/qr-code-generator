<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Générateur de QR code</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --surface: #fff;
    --border: #e2e4e9;
    --text: #14161a;
    --muted: #666c76;
    --accent: #2f6df6;
    --accent-text: #fff;
    --danger: #c0392b;
    --warn-bg: #fff8e5;
    --warn-text: #7a5200;
    --warn-border: #f0d9a0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121316;
      --surface: #1b1d21;
      --border: #2c2f35;
      --text: #f0f1f3;
      --muted: #9aa1ac;
      --accent: #5a8dff;
      --accent-text: #0d1117;
      --danger: #ff7a6b;
      --warn-bg: #2a2313;
      --warn-text: #e8c882;
      --warn-border: #4a3d1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2.5rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { margin: 0 0 .35rem; font-size: 1.5rem; letter-spacing: -.02em; }
  .sub { margin: 0 0 1.5rem; color: var(--muted); font-size: .95rem; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .06);
  }

  /* Onglets de mode */
  .tabs { display: flex; gap: .35rem; margin-bottom: 1.25rem; padding: .25rem;
          background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
  .tabs button {
    flex: 1; padding: .55rem .5rem; border: 1px solid transparent; border-radius: 7px;
    background: none; color: var(--muted); font: 600 .9rem inherit; font-family: inherit; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--surface); border-color: var(--border); color: var(--text); }

  label { display: block; margin-bottom: .4rem; font-size: .8rem; font-weight: 600;
          text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  input[type="text"], select {
    width: 100%;
    padding: .75rem .8rem;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--bg);
    color: var(--text);
    font: .95rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  select { font-family: inherit; }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  input:disabled { opacity: .5; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; }
  .field + .field, .field + .row, .row + .field { margin-top: .9rem; }
  .check { display: flex; align-items: center; gap: .5rem; margin-top: .9rem; }
  .check input { width: auto; margin: 0; accent-color: var(--accent); }
  .check label { margin: 0; text-transform: none; letter-spacing: normal; font-size: .88rem;
                 font-weight: 400; color: var(--text); }
  @media (max-width: 30rem) { .row { grid-template-columns: 1fr; } }

  .preview {
    display: flex; align-items: center; justify-content: center;
    min-height: 15rem; margin-top: 1.25rem; padding: 1rem;
    border: 1px dashed var(--border); border-radius: 12px; background: var(--bg);
  }
  canvas { display: none; width: 100%; max-width: 17rem; height: auto; border-radius: 6px; image-rendering: pixelated; }
  .ready canvas { display: block; }
  .ready .hint { display: none; }
  .hint { margin: 0; color: var(--muted); font-size: .9rem; text-align: center; }
  .status { min-height: 1.4rem; margin: .9rem 0 0; text-align: center; font-size: .82rem; color: var(--muted); }
  .status.err { color: var(--danger); }
  .notice {
    margin: .9rem 0 0; padding: .6rem .8rem; border: 1px solid var(--warn-border);
    border-radius: 9px; background: var(--warn-bg); color: var(--warn-text); font-size: .82rem;
  }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin-top: .9rem; }
  button.act {
    padding: .6rem 1rem; border: 1px solid var(--border); border-radius: 9px;
    background: var(--surface); color: var(--text); font: 500 .9rem inherit; font-family: inherit; cursor: pointer;
  }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.act:hover:not(:disabled) { border-color: var(--accent); }
  button.act:disabled { opacity: .45; cursor: not-allowed; }
  footer { margin-top: 1.25rem; text-align: center; font-size: .78rem; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Générateur de QR code</h1>
  <p class="sub">Un lien à partager, ou un réseau Wi-Fi auquel se connecter sans dicter la clé. Tout est calculé sur votre appareil : ce fichier fonctionne sans connexion internet.</p>

  <div class="card">
    <div class="tabs" role="tablist" aria-label="Type de QR code">
      <button type="button" role="tab" id="tab-url" aria-controls="pane-url" aria-selected="true">Site web</button>
      <button type="button" role="tab" id="tab-wifi" aria-controls="pane-wifi" aria-selected="false">Réseau Wi-Fi</button>
    </div>

    <div id="pane-url" role="tabpanel" aria-labelledby="tab-url">
      <div class="field">
        <label for="url">Adresse du site</label>
        <input id="url" type="text" placeholder="https://exemple.com/ma-page" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <div id="pane-wifi" role="tabpanel" aria-labelledby="tab-wifi" hidden>
      <div class="field">
        <label for="ssid">Nom du réseau (SSID)</label>
        <input id="ssid" type="text" placeholder="Livebox-A1B2" autocomplete="off" spellcheck="false">
      </div>
      <div class="row">
        <div class="field">
          <label for="security">Sécurité</label>
          <select id="security">
            <option value="WPA" selected>WPA / WPA2 / WPA3</option>
            <option value="WEP">WEP (ancien)</option>
            <option value="nopass">Ouvert, sans mot de passe</option>
          </select>
        </div>
        <div class="field">
          <label for="wifi-password">Mot de passe</label>
          <input id="wifi-password" type="text" placeholder="clé du réseau" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="check">
        <input id="hidden-network" type="checkbox">
        <label for="hidden-network">Réseau caché (SSID non diffusé)</label>
      </div>
    </div>

    <div class="preview" id="preview">
      <canvas id="canvas" role="img" aria-label="Aperçu du QR code"></canvas>
      <p class="hint" id="hint">Le QR code apparaîtra ici.</p>
    </div>

    <p class="status" id="status" aria-live="polite"></p>
    <p class="notice" id="notice" hidden></p>

    <div class="actions">
      <button id="png" class="act primary" type="button" disabled>Télécharger le PNG</button>
      <button id="svg" class="act" type="button" disabled>Télécharger le SVG</button>
      <button id="copy" class="act" type="button" disabled>Copier l'image</button>
    </div>
  </div>

  <footer>Aucune donnée n'est envoyée sur internet. Fichier autonome, partageable tel quel.</footer>
</main>

<script>
/* Copie de qrcode.js, intégrée par build-standalone.js.
   Ne pas modifier ici : éditer qrcode.js puis relancer « node build-standalone.js ». */
/**
 * Encodeur QR Code (ISO/IEC 18004) en JavaScript pur, sans dépendance.
 *
 * Mode d'encodage : byte (UTF-8) — adapté aux URLs.
 * Versions 1 à 40, niveaux de correction L / M / Q / H.
 *
 * API :
 *   QRCode.encode(texte, niveau) -> { size, version, ecl, mask, modules }
 *   modules : tableau [y][x] de booléens (true = module noir)
 */
(function (global) {
  'use strict';

  // Bits d'identification du niveau de correction dans les format bits.
  const ECC_LEVELS = {
    L: { name: 'L', formatBits: 1, index: 0 },
    M: { name: 'M', formatBits: 0, index: 1 },
    Q: { name: 'Q', formatBits: 3, index: 2 },
    H: { name: 'H', formatBits: 2, index: 3 },
  };

  // Nombre de codewords de correction par bloc, indexé [niveau][version].
  const ECC_CODEWORDS_PER_BLOCK = [
    // version : 0 (inutilisé), 1, 2, 3, ...
    [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30], // L
    [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28], // M
    [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30], // Q
    [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30], // H
  ];

  // Nombre de blocs de correction, indexé [niveau][version].
  const NUM_ERROR_CORRECTION_BLOCKS = [
    [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25], // L
    [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49], // M
    [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68], // Q
    [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81], // H
  ];

  const PENALTY_N1 = 3;
  const PENALTY_N2 = 3;
  const PENALTY_N3 = 40;
  const PENALTY_N4 = 10;

  const MIN_VERSION = 1;
  const MAX_VERSION = 40;

  function getBit(x, i) {
    return ((x >>> i) & 1) !== 0;
  }

  // Nombre total de modules de données (hors motifs de fonction) pour une version.
  function getNumRawDataModules(ver) {
    let result = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const numAlign = Math.floor(ver / 7) + 2;
      result -= (25 * numAlign - 10) * numAlign - 55;
      if (ver >= 7) result -= 36;
    }
    return result;
  }

  // Nombre de codewords de données disponibles pour une version et un niveau.
  function getNumDataCodewords(ver, ecl) {
    return (
      Math.floor(getNumRawDataModules(ver) / 8) -
      ECC_CODEWORDS_PER_BLOCK[ecl.index][ver] * NUM_ERROR_CORRECTION_BLOCKS[ecl.index][ver]
    );
  }

  // Positions des centres des motifs d'alignement.
  function getAlignmentPatternPositions(ver) {
    if (ver === 1) return [];
    const numAlign = Math.floor(ver / 7) + 2;
    const step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (numAlign * 2 - 2)) * 2;
    const result = [6];
    for (let pos = ver * 4 + 10; result.length < numAlign; pos -= step) {
      result.splice(1, 0, pos);
    }
    return result;
  }

  // ---------------------------------------------------------------------------
  // Arithmétique dans GF(256) et Reed-Solomon
  // ---------------------------------------------------------------------------

  function reedSolomonMultiply(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11d);
      z ^= ((y >>> i) & 1) * x;
    }
    return z & 0xff;
  }

  function reedSolomonComputeDivisor(degree) {
    const result = new Array(degree).fill(0);
    result[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < result.length; j++) {
        result[j] = reedSolomonMultiply(result[j], root);
        if (j + 1 < result.length) result[j] ^= result[j + 1];
      }
      root = reedSolomonMultiply(root, 0x02);
    }
    return result;
  }

  function reedSolomonComputeRemainder(data, divisor) {
    const result = divisor.map(() => 0);
    for (const b of data) {
      const factor = b ^ result.shift();
      result.push(0);
      divisor.forEach((coef, i) => {
        result[i] ^= reedSolomonMultiply(coef, factor);
      });
    }
    return result;
  }

  // ---------------------------------------------------------------------------
  // Construction du flux binaire
  // ---------------------------------------------------------------------------

  function toUtf8Bytes(text) {
    if (typeof TextEncoder !== 'undefined') {
      return Array.from(new TextEncoder().encode(text));
    }
    // Repli pour les environnements sans TextEncoder.
    return Array.from(unescape(encodeURIComponent(text)), (c) => c.charCodeAt(0));
  }

  function appendBits(bitBuffer, value, len) {
    for (let i = len - 1; i >= 0; i--) {
      bitBuffer.push((value >>> i) & 1);
    }
  }

  function charCountBits(ver) {
    return ver <= 9 ? 8 : 16;
  }

  // Plus petite version capable de contenir les données.
  function chooseVersion(numBytes, ecl) {
    for (let ver = MIN_VERSION; ver <= MAX_VERSION; ver++) {
      const capacityBits = getNumDataCodewords(ver, ecl) * 8;
      const neededBits = 4 + charCountBits(ver) + numBytes * 8;
      if (neededBits <= capacityBits) return ver;
    }
    return null;
  }

  function buildCodewords(bytes, ver, ecl) {
    const bb = [];
    appendBits(bb, 0b0100, 4); // indicateur de mode « byte »
    appendBits(bb, bytes.length, charCountBits(ver));
    for (const b of bytes) appendBits(bb, b, 8);

    const dataCapacityBits = getNumDataCodewords(ver, ecl) * 8;

    // Terminateur, puis alignement sur l'octet.
    appendBits(bb, 0, Math.min(4, dataCapacityBits - bb.length));
    appendBits(bb, 0, (8 - (bb.length % 8)) % 8);

    // Octets de remplissage alternés.
    for (let padByte = 0xec; bb.length < dataCapacityBits; padByte ^= 0xec ^ 0x11) {
      appendBits(bb, padByte, 8);
    }

    const codewords = [];
    for (let i = 0; i < bb.length; i += 8) {
      let byte = 0;
      for (let j = 0; j < 8; j++) byte = (byte << 1) | bb[i + j];
      codewords.push(byte);
    }
    return codewords;
  }

  // Ajout de la correction d'erreur et entrelacement des blocs.
  function addEccAndInterleave(data, ver, ecl) {
    const numBlocks = NUM_ERROR_CORRECTION_BLOCKS[ecl.index][ver];
    const blockEccLen = ECC_CODEWORDS_PER_BLOCK[ecl.index][ver];
    const rawCodewords = Math.floor(getNumRawDataModules(ver) / 8);
    const numShortBlocks = numBlocks - (rawCodewords % numBlocks);
    const shortBlockLen = Math.floor(rawCodewords / numBlocks);

    const blocks = [];
    const rsDiv = reedSolomonComputeDivisor(blockEccLen);
    for (let i = 0, k = 0; i < numBlocks; i++) {
      const len = shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1);
      const dat = data.slice(k, k + len);
      k += len;
      const ecc = reedSolomonComputeRemainder(dat, rsDiv);
      if (i < numShortBlocks) dat.push(0); // remplissage pour l'entrelacement
      blocks.push(dat.concat(ecc));
    }

    const result = [];
    for (let i = 0; i < blocks[0].length; i++) {
      blocks.forEach((block, j) => {
        // On saute le remplissage ajouté aux blocs courts.
        if (i !== shortBlockLen - blockEccLen || j >= numShortBlocks) {
          result.push(block[i]);
        }
      });
    }
    return result;
  }

  // ---------------------------------------------------------------------------
  // Dessin de la matrice
  // ---------------------------------------------------------------------------

  function QrMatrix(ver, ecl) {
    this.version = ver;
    this.ecl = ecl;
    this.size = ver * 4 + 17;
    this.modules = [];
    this.isFunction = [];
    for (let y = 0; y < this.size; y++) {
      this.modules.push(new Array(this.size).fill(false));
      this.isFunction.push(new Array(this.size).fill(false));
    }
  }

  QrMatrix.prototype.setFunctionModule = function (x, y, isDark) {
    this.modules[y][x] = isDark;
    this.isFunction[y][x] = true;
  };

  QrMatrix.prototype.drawFinderPattern = function (x, y) {
    for (let dy = -4; dy <= 4; dy++) {
      for (let dx = -4; dx <= 4; dx++) {
        const dist = Math.max(Math.abs(dx), Math.abs(dy));
        const xx = x + dx;
        const yy = y + dy;
        if (xx >= 0 && xx < this.size && yy >= 0 && yy < this.size) {
          this.setFunctionModule(xx, yy, dist !== 2 && dist !== 4);
        }
      }
    }
  };

  QrMatrix.prototype.drawAlignmentPattern = function (x, y) {
    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        this.setFunctionModule(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }
    }
  };

  QrMatrix.prototype.drawFormatBits = function (mask) {
    const data = (this.ecl.formatBits << 3) | mask;
    let rem = data;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    const bits = ((data << 10) | rem) ^ 0x5412;

    // Première copie, autour du motif de recherche supérieur gauche.
    for (let i = 0; i <= 5; i++) this.setFunctionModule(8, i, getBit(bits, i));
    this.setFunctionModule(8, 7, getBit(bits, 6));
    this.setFunctionModule(8, 8, getBit(bits, 7));
    this.setFunctionModule(7, 8, getBit(bits, 8));
    for (let i = 9; i < 15; i++) this.setFunctionModule(14 - i, 8, getBit(bits, i));

    // Seconde copie, en bas à gauche et en haut à droite.
    for (let i = 0; i < 8; i++) this.setFunctionModule(this.size - 1 - i, 8, getBit(bits, i));
    for (let i = 8; i < 15; i++) this.setFunctionModule(8, this.size - 15 + i, getBit(bits, i));
    this.setFunctionModule(8, this.size - 8, true); // module toujours noir
  };

  QrMatrix.prototype.drawVersion = function () {
    if (this.version < 7) return;
    let rem = this.version;
    for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
    const bits = (this.version << 12) | rem;
    for (let i = 0; i < 18; i++) {
      const isDark = getBit(bits, i);
      const a = this.size - 11 + (i % 3);
      const b = Math.floor(i / 3);
      this.setFunctionModule(a, b, isDark);
      this.setFunctionModule(b, a, isDark);
    }
  };

  QrMatrix.prototype.drawFunctionPatterns = function () {
    // Motifs de synchronisation.
    for (let i = 0; i < this.size; i++) {
      this.setFunctionModule(6, i, i % 2 === 0);
      this.setFunctionModule(i, 6, i % 2 === 0);
    }

    this.drawFinderPattern(3, 3);
    this.drawFinderPattern(this.size - 4, 3);
    this.drawFinderPattern(3, this.size - 4);

    const alignPatPos = getAlignmentPatternPositions(this.version);
    const numAlign = alignPatPos.length;
    for (let i = 0; i < numAlign; i++) {
      for (let j = 0; j < numAlign; j++) {
        const isFinderCorner =
          (i === 0 && j === 0) ||
          (i === 0 && j === numAlign - 1) ||
          (i === numAlign - 1 && j === 0);
        if (!isFinderCorner) this.drawAlignmentPattern(alignPatPos[i], alignPatPos[j]);
      }
    }

    this.drawFormatBits(0); // valeurs provisoires, réécrites après le choix du masque
    this.drawVersion();
  };

  // Placement des codewords en zigzag.
  QrMatrix.prototype.drawCodewords = function (data) {
    let i = 0;
    for (let right = this.size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5; // on saute la colonne de synchronisation
      for (let vert = 0; vert < this.size; vert++) {
        for (let j = 0; j < 2; j++) {
          const x = right - j;
          const upward = ((right + 1) & 2) === 0;
          const y = upward ? this.size - 1 - vert : vert;
          if (!this.isFunction[y][x] && i < data.length * 8) {
            this.modules[y][x] = getBit(data[i >>> 3], 7 - (i & 7));
            i++;
          }
        }
      }
    }
  };

  QrMatrix.prototype.applyMask = function (mask) {
    for (let y = 0; y < this.size; y++) {
      for (let x = 0; x < this.size; x++) {
        let invert;
        switch (mask) {
          case 0: invert = (x + y) % 2 === 0; break;
          case 1: invert = y % 2 === 0; break;
          case 2: invert = x % 3 === 0; break;
          case 3: invert = (x + y) % 3 === 0; break;
          case 4: invert = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
          case 5: invert = ((x * y) % 2) + ((x * y) % 3) === 0; break;
          case 6: invert = (((x * y) % 2) + ((x * y) % 3)) % 2 === 0; break;
          case 7: invert = (((x + y) % 2) + ((x * y) % 3)) % 2 === 0; break;
          default: throw new Error('Masque invalide');
        }
        if (!this.isFunction[y][x] && invert) {
          this.modules[y][x] = !this.modules[y][x];
        }
      }
    }
  };

  QrMatrix.prototype.finderPenaltyAddHistory = function (currentRunLength, runHistory) {
    if (runHistory[0] === 0) currentRunLength += this.size; // bordure claire virtuelle
    runHistory.pop();
    runHistory.unshift(currentRunLength);
  };

  QrMatrix.prototype.finderPenaltyCountPatterns = function (runHistory) {
    const n = runHistory[1];
    const core =
      n > 0 &&
      runHistory[2] === n &&
      runHistory[3] === n * 3 &&
      runHistory[4] === n &&
      runHistory[5] === n;
    return (
      (core && runHistory[0] >= n * 4 && runHistory[6] >= n ? 1 : 0) +
      (core && runHistory[6] >= n * 4 && runHistory[0] >= n ? 1 : 0)
    );
  };

  QrMatrix.prototype.finderPenaltyTerminateAndCount = function (runColor, runLength, runHistory) {
    if (runColor) {
      this.finderPenaltyAddHistory(runLength, runHistory);
      runLength = 0;
    }
    runLength += this.size; // bordure claire virtuelle
    this.finderPenaltyAddHistory(runLength, runHistory);
    return this.finderPenaltyCountPatterns(runHistory);
  };

  QrMatrix.prototype.getPenaltyScore = function () {
    let result = 0;
    const size = this.size;

    // Suites de modules de même couleur et motifs trompeurs, en lignes.
    for (let y = 0; y < size; y++) {
      let runColor = false;
      let runLen = 0;
      const runHistory = [0, 0, 0, 0, 0, 0, 0];
      for (let x = 0; x < size; x++) {
        if (this.modules[y][x] === runColor) {
          runLen++;
          if (runLen === 5) result += PENALTY_N1;
          else if (runLen > 5) result++;
        } else {
          this.finderPenaltyAddHistory(runLen, runHistory);
          if (!runColor) result += this.finderPenaltyCountPatterns(runHistory) * PENALTY_N3;
          runColor = this.modules[y][x];
          runLen = 1;
        }
      }
      result += this.finderPenaltyTerminateAndCount(runColor, runLen, runHistory) * PENALTY_N3;
    }

    // Idem, en colonnes.
    for (let x = 0; x < size; x++) {
      let runColor = false;
      let runLen = 0;
      const runHistory = [0, 0, 0, 0, 0, 0, 0];
      for (let y = 0; y < size; y++) {
        if (this.modules[y][x] === runColor) {
          runLen++;
          if (runLen === 5) result += PENALTY_N1;
          else if (runLen > 5) result++;
        } else {
          this.finderPenaltyAddHistory(runLen, runHistory);
          if (!runColor) result += this.finderPenaltyCountPatterns(runHistory) * PENALTY_N3;
          runColor = this.modules[y][x];
          runLen = 1;
        }
      }
      result += this.finderPenaltyTerminateAndCount(runColor, runLen, runHistory) * PENALTY_N3;
    }

    // Blocs 2x2 de même couleur.
    for (let y = 0; y < size - 1; y++) {
      for (let x = 0; x < size - 1; x++) {
        const color = this.modules[y][x];
        if (
          color === this.modules[y][x + 1] &&
          color === this.modules[y + 1][x] &&
          color === this.modules[y + 1][x + 1]
        ) {
          result += PENALTY_N2;
        }
      }
    }

    // Déséquilibre entre modules clairs et sombres.
    let dark = 0;
    for (const row of this.modules) {
      for (const cell of row) if (cell) dark++;
    }
    const total = size * size;
    const k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
    result += k * PENALTY_N4;

    return result;
  };

  // ---------------------------------------------------------------------------
  // API publique
  // ---------------------------------------------------------------------------

  function encode(text, level) {
    if (typeof text !== 'string' || text.length === 0) {
      throw new Error('Texte à encoder vide');
    }
    const ecl = ECC_LEVELS[(level || 'M').toUpperCase()];
    if (!ecl) throw new Error('Niveau de correction inconnu : ' + level);

    const bytes = toUtf8Bytes(text);
    const ver = chooseVersion(bytes.length, ecl);
    if (ver === null) {
      throw new Error(
        'Texte trop long pour un QR code (' + bytes.length + ' octets au niveau ' + ecl.name + ')'
      );
    }

    const dataCodewords = buildCodewords(bytes, ver, ecl);
    const allCodewords = addEccAndInterleave(dataCodewords, ver, ecl);

    const qr = new QrMatrix(ver, ecl);
    qr.drawFunctionPatterns();
    qr.drawCodewords(allCodewords);

    // Sélection du masque minimisant le score de pénalité.
    let bestMask = 0;
    let minPenalty = Infinity;
    for (let mask = 0; mask < 8; mask++) {
      qr.applyMask(mask);
      qr.drawFormatBits(mask);
      const penalty = qr.getPenaltyScore();
      if (penalty < minPenalty) {
        minPenalty = penalty;
        bestMask = mask;
      }
      qr.applyMask(mask); // le masquage est involutif : on l'annule
    }
    qr.applyMask(bestMask);
    qr.drawFormatBits(bestMask);

    return {
      size: qr.size,
      version: qr.version,
      ecl: ecl.name,
      mask: bestMask,
      modules: qr.modules,
      byteLength: bytes.length,
      maxBytes: getNumDataCodewords(ver, ecl) - (charCountBits(ver) === 8 ? 2 : 3),
    };
  }

  global.QRCode = {
    encode,
    MAX_VERSION,
    // Exposé pour les tests (tests/decode-roundtrip.js), pas pour l'usage courant.
    _internals: {
      ECC_LEVELS,
      ECC_CODEWORDS_PER_BLOCK,
      NUM_ERROR_CORRECTION_BLOCKS,
      getNumRawDataModules,
      getNumDataCodewords,
      getAlignmentPatternPositions,
      reedSolomonComputeDivisor,
      reedSolomonComputeRemainder,
      charCountBits,
    },
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/* Copie de payload.js, intégrée par build-standalone.js.
   Ne pas modifier ici : éditer payload.js puis relancer « node build-standalone.js ». */
/**
 * Construction du contenu encodé dans le QR code, selon le mode choisi.
 *
 * Deux modes :
 *   - « url »  : une adresse web, normalisée pour être ouvrable.
 *   - « wifi » : une configuration de réseau, que les téléphones reconnaissent
 *                pour se connecter sans saisir la clé (format ZXing, lu par
 *                iOS 11+ et Android).
 *
 * API :
 *   Payload.url(texte)                        -> 'https://...'
 *   Payload.wifi({ ssid, security, password, hidden }) -> 'WIFI:T:WPA;S:...;P:...;;'
 *   Payload.wifiWarnings({ ... })             -> [messages] (problèmes probables côté téléphone)
 */
(function (global) {
  'use strict';

  // Ajoute https:// quand le schéma est absent, pour que le QR pointe vers un lien cliquable.
  function url(raw) {
    const text = String(raw).trim();
    if (text === '') return '';
    return /^[a-zA-Z][a-zA-Z0-9+.\-]*:/.test(text) ? text : 'https://' + text;
  }

  // Dans le format Wi-Fi, ces caractères délimitent les champs : ils doivent être
  // précédés d'un antislash. Une seule passe de remplacement évite le piège
  // classique du double échappement (un antislash déjà inséré re-échappé ensuite).
  function escapeValue(value) {
    return String(value).replace(/([\\;,":])/g, '\\$1');
  }

  // Une valeur entièrement hexadécimale serait prise pour une suite d'octets :
  // les guillemets forcent son interprétation comme texte. La longueur paire
  // fait partie de la condition, car un nombre impair de chiffres ne peut pas
  // former des octets : « abcde » n'est pas ambigu, inutile de le guillemeter.
  function isAmbiguousHex(text) {
    return text !== '' && text.length % 2 === 0 && /^[0-9a-fA-F]+$/.test(text);
  }

  function encodeField(value) {
    const text = String(value);
    const escaped = escapeValue(text);
    return isAmbiguousHex(text) ? '"' + escaped + '"' : escaped;
  }

  const SECURITY_TYPES = {
    // « WPA » couvre WPA, WPA2 et WPA3 : les téléphones le traitent comme un
    // joker et négocient le protocole réellement offert par la box. Le type
    // « SAE », pourtant propre au WPA3, est mal géré par beaucoup de lecteurs.
    WPA: { tag: 'WPA', needsPassword: true },
    WEP: { tag: 'WEP', needsPassword: true },
    nopass: { tag: 'nopass', needsPassword: false },
  };

  function wifi(options) {
    const opts = options || {};
    const ssid = String(opts.ssid == null ? '' : opts.ssid);
    const security = SECURITY_TYPES[opts.security] ? opts.security : 'WPA';
    const password = String(opts.password == null ? '' : opts.password);
    const type = SECURITY_TYPES[security];

    if (ssid.trim() === '') return '';

    const parts = ['WIFI:', 'T:' + type.tag + ';', 'S:' + encodeField(ssid) + ';'];
    if (type.needsPassword && password !== '') {
      parts.push('P:' + encodeField(password) + ';');
    }
    if (opts.hidden) {
      parts.push('H:true;');
    }
    parts.push(';'); // le format se termine par deux points-virgules
    return parts.join('');
  }

  // Problèmes qui feraient échouer la connexion sur le téléphone, sans empêcher
  // la génération du code : l'utilisateur reste libre de passer outre.
  function wifiWarnings(options) {
    const opts = options || {};
    const security = SECURITY_TYPES[opts.security] ? opts.security : 'WPA';
    const password = String(opts.password == null ? '' : opts.password);
    const warnings = [];

    if (security === 'WPA') {
      if (password.length > 0 && password.length < 8) {
        warnings.push('une clé WPA doit faire au moins 8 caractères');
      }
      if (password.length > 63) {
        warnings.push('une clé WPA ne peut pas dépasser 63 caractères');
      }
    } else if (security === 'WEP') {
      const hexLengths = [10, 26];
      const asciiLengths = [5, 13];
      const isHex = /^[0-9a-fA-F]+$/.test(password);
      const validLengths = isHex ? hexLengths.concat(asciiLengths) : asciiLengths;
      if (password.length > 0 && validLengths.indexOf(password.length) === -1) {
        warnings.push('une clé WEP fait 5 ou 13 caractères (ou 10 ou 26 en hexadécimal)');
      }
    }

    if (security !== 'nopass' && password === '') {
      warnings.push('mot de passe manquant');
    }

    return warnings;
  }

  global.Payload = { url, wifi, wifiWarnings, escapeValue, SECURITY_TYPES };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/* Interface : saisie -> rendu du QR code -> export. */
(function () {
  'use strict';

  var QUIET = 4;        // marge blanche obligatoire, en modules
  var ECC = 'M';        // correction d'erreur : bon compromis densité / robustesse
  var TARGET_PX = 1024; // taille visée pour les exports (impression confortable)

  var tabs = {
    url: document.getElementById('tab-url'),
    wifi: document.getElementById('tab-wifi'),
  };
  var panes = {
    url: document.getElementById('pane-url'),
    wifi: document.getElementById('pane-wifi'),
  };
  var urlInput = document.getElementById('url');
  var ssidInput = document.getElementById('ssid');
  var securitySelect = document.getElementById('security');
  var passwordInput = document.getElementById('wifi-password');
  var hiddenCheck = document.getElementById('hidden-network');

  var canvas = document.getElementById('canvas');
  var preview = document.getElementById('preview');
  var hint = document.getElementById('hint');
  var status = document.getElementById('status');
  var notice = document.getElementById('notice');
  var pngBtn = document.getElementById('png');
  var svgBtn = document.getElementById('svg');
  var copyBtn = document.getElementById('copy');

  var mode = 'url';
  var current = null;

  function fileName() {
    if (mode === 'wifi') {
      var ssid = ssidInput.value.trim().replace(/[^a-zA-Z0-9.\-]+/g, '-').replace(/^-+|-+$/g, '');
      return ssid ? 'wifi-' + ssid : 'wifi-qr';
    }
    var host = '';
    try { host = new URL(current.text).hostname; } catch (e) { host = ''; }
    var slug = host.replace(/[^a-zA-Z0-9.\-]/g, '');
    return slug ? 'qr-' + slug : 'qr-code';
  }

  function draw(qr) {
    var total = qr.size + QUIET * 2;
    // Échelle entière : chaque module occupe un nombre entier de pixels, donc aucun flou.
    var scale = Math.max(1, Math.floor(TARGET_PX / total));
    var px = total * scale;
    canvas.width = px;
    canvas.height = px;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = '#000';
    for (var y = 0; y < qr.size; y++) {
      for (var x = 0; x < qr.size; x++) {
        if (qr.modules[y][x]) ctx.fillRect((x + QUIET) * scale, (y + QUIET) * scale, scale, scale);
      }
    }
    return px;
  }

  function toSvg(qr, px) {
    var total = qr.size + QUIET * 2;
    var path = [];
    for (var y = 0; y < qr.size; y++) {
      for (var x = 0; x < qr.size; x++) {
        if (qr.modules[y][x]) path.push('M' + (x + QUIET) + ' ' + (y + QUIET) + 'h1v1h-1z');
      }
    }
    return '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + px + '" height="' + px + '"' +
      ' viewBox="0 0 ' + total + ' ' + total + '" shape-rendering="crispEdges">' +
      '<rect width="' + total + '" height="' + total + '" fill="#ffffff"/>' +
      '<path d="' + path.join('') + '" fill="#000000"/></svg>\n';
  }

  function setStatus(msg, isError) {
    status.textContent = msg;
    status.classList.toggle('err', !!isError);
  }

  function setNotice(msg) {
    notice.textContent = msg || '';
    notice.hidden = !msg;
  }

  function setEnabled(on) {
    pngBtn.disabled = !on;
    svgBtn.disabled = !on;
    copyBtn.disabled = !on || !window.ClipboardItem;
  }

  function clear(message) {
    current = null;
    preview.classList.remove('ready');
    hint.textContent = message || 'Le QR code apparaîtra ici.';
    setEnabled(false);
    setStatus('');
    setNotice('');
  }

  // Contenu à encoder selon le mode, et description affichée sous l'aperçu.
  function buildPayload() {
    if (mode === 'wifi') {
      var options = {
        ssid: ssidInput.value,
        security: securitySelect.value,
        password: passwordInput.value,
        hidden: hiddenCheck.checked,
      };
      var text = Payload.wifi(options);
      if (text === '') return { text: '', empty: 'Saisissez le nom du réseau.' };
      var labels = { WPA: 'WPA/WPA2/WPA3', WEP: 'WEP', nopass: 'réseau ouvert' };
      var describe = 'Réseau ' + ssidInput.value.trim() + ' · ' + labels[options.security] +
                     (options.hidden ? ' · caché' : '');
      var warnings = Payload.wifiWarnings(options);
      var notes = [];
      // Inutile de prévenir sur un réseau déjà ouvert : il n'y a rien à divulguer.
      if (options.security !== 'nopass') {
        notes.push('Ce code contient la clé du réseau : qui le scanne obtient l’accès.');
      }
      if (warnings.length) notes.unshift('À vérifier : ' + warnings.join(', ') + '.');
      return { text: text, describe: describe, notice: notes.join(' ') };
    }
    var url = Payload.url(urlInput.value);
    if (url === '') return { text: '', empty: 'Collez une adresse pour voir le QR code.' };
    return { text: url, describe: url.length > 46 ? url.slice(0, 45) + '…' : url, notice: '' };
  }

  function generate() {
    var payload = buildPayload();
    if (payload.text === '') {
      clear(payload.empty);
      return;
    }
    var qr;
    try {
      qr = QRCode.encode(payload.text, ECC);
    } catch (err) {
      clear();
      setStatus(err.message, true);
      return;
    }
    var px = draw(qr);
    current = { qr: qr, text: payload.text, px: px };
    preview.classList.add('ready');
    canvas.setAttribute('aria-label', 'QR code : ' + payload.describe);
    setEnabled(true);
    setStatus(payload.describe + ' · version ' + qr.version + ' · ' + qr.size + '×' + qr.size +
              ' modules · image ' + px + '×' + px + ' px');
    setNotice(payload.notice);
  }

  function selectMode(next) {
    mode = next;
    Object.keys(tabs).forEach(function (key) {
      tabs[key].setAttribute('aria-selected', String(key === next));
      panes[key].hidden = key !== next;
    });
    (next === 'wifi' ? ssidInput : urlInput).focus();
    generate();
  }

  function download(blob, name) {
    var href = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = href;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(href); }, 1000);
  }

  var timer = null;
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(generate, 120);
  }

  Object.keys(tabs).forEach(function (key) {
    tabs[key].addEventListener('click', function () { selectMode(key); });
  });
  // Navigation clavier entre onglets, comme attendu d'une barre d'onglets.
  document.querySelector('.tabs').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault();
    selectMode(mode === 'url' ? 'wifi' : 'url');
    tabs[mode].focus();
  });

  [urlInput, ssidInput, passwordInput].forEach(function (el) {
    el.addEventListener('input', schedule);
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { clearTimeout(timer); generate(); }
    });
  });
  hiddenCheck.addEventListener('change', generate);
  securitySelect.addEventListener('change', function () {
    // Un réseau ouvert n'a pas de mot de passe : le champ n'a plus de sens.
    var open = securitySelect.value === 'nopass';
    passwordInput.disabled = open;
    if (open) passwordInput.value = '';
    generate();
  });

  pngBtn.addEventListener('click', function () {
    if (!current) return;
    canvas.toBlob(function (blob) { download(blob, fileName() + '.png'); }, 'image/png');
  });

  svgBtn.addEventListener('click', function () {
    if (!current) return;
    download(new Blob([toSvg(current.qr, current.px)], { type: 'image/svg+xml' }), fileName() + '.svg');
  });

  copyBtn.addEventListener('click', function () {
    if (!current || !window.ClipboardItem) return;
    canvas.toBlob(function (blob) {
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
        .then(function () { setStatus('Image copiée dans le presse-papiers.'); })
        .catch(function () { setStatus('Copie refusée par le navigateur : utilisez le téléchargement.', true); });
    }, 'image/png');
  });

  setEnabled(false);
  urlInput.focus();
})();
</script>
</body>
